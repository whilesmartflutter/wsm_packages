name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test wsm_core
        working-directory: packages/wsm_core
        run: dart test

      - name: Test wsm_network
        working-directory: packages/wsm_network
        run: flutter test

      - name: Test wsm_crash
        working-directory: packages/wsm_crash
        run: flutter test
