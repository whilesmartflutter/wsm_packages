name: wsm_secure_storage
description: Keychain/keystore-backed implementation of wsm_network's TokenStorage interface.
version: 0.1.0
homepage: https://github.com/whilesmartflutter/wsm_packages
repository: https://github.com/whilesmartflutter/wsm_packages
issue_tracker: https://github.com/whilesmartflutter/wsm_packages/issues
publish_to: none

resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  # Widened so apps on either major can adopt this without a storage
  # migration that could invalidate stored tokens.
  flutter_secure_storage: ">=9.0.0 <11.0.0"
  wsm_network: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
