name: wsm_crash_firebase
description: Firebase Crashlytics implementation of wsm_crash's CrashReportingInterface.
version: 0.1.1
homepage: https://github.com/whilesmartflutter/wsm_packages
repository: https://github.com/whilesmartflutter/wsm_packages
issue_tracker: https://github.com/whilesmartflutter/wsm_packages/issues
publish_to: none

resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.16.0"

dependencies:
  dio: ^5.8.0
  # Widened for apps still on Crashlytics 4.x — the API this package uses
  # (recordError, setCustomKey, setUserIdentifier, log,
  # setCrashlyticsCollectionEnabled, sendUnsentReports) is unchanged across
  # 4.x and 5.x.
  firebase_crashlytics: ">=4.0.0 <6.0.0"
  flutter:
    sdk: flutter
  meta: ^1.15.0
  wsm_crash: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
